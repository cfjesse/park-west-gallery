[build]
  # Where Netlify runs its build command from
  base = "node-api"
  # Install dependencies before deploying
  command = "npm install"
  # Netlify Functions directory (relative to base)
  functions = "node-api/netlify/functions"
  # No static publish dir — this is API only
  publish = "node-api/public"

[functions]
  # Bundle all dependencies inline with esbuild — no native binaries needed
  node_bundler = "esbuild"

# Rewrite /api/* → the Netlify Function so callers use clean URLs
# The function receives the full original URL path, so Express routing works as-is
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Health-check convenience redirect
[[redirects]]
  from = "/"
  to = "/api/health"
  status = 302
